[package]
name = "mobile_server"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "HTTP server that serves Zed's mobile PWA and relays it to Zed"
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "mobile_server"
path = "src/mobile_server.rs"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
env_logger.workspace = true
futures.workspace = true
hkdf.workspace = true
http_client_tls.workspace = true
log.workspace = true
mime_guess.workspace = true
mobile_protocol.workspace = true
p256.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url.workspace = true
