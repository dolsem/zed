[package]
name = "http_api"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "HTTP server that relays Zed's HTTP API to Zed, and serves the web UI"

[lints]
workspace = true

[[bin]]
name = "http_api"
path = "src/http_api.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
env_logger.workspace = true
futures.workspace = true
http_client_tls.workspace = true
log.workspace = true
mobile_protocol.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
web_ui.workspace = true
